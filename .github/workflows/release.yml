name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # macos-15 ships an Xcode whose toolchain still compiles x86_64; the "Toolchain" step prints what it used.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: sw_vers && xcodebuild -version && swift --version

      - name: Build universal Yon.dmg
        env:
          ARCHS: arm64 x86_64
          # Repository secrets; empty when unset, in which case rclone's shared clients are used.
          YON_GOOGLE_CLIENT_ID: ${{ secrets.YON_GOOGLE_CLIENT_ID }}
          YON_GOOGLE_CLIENT_SECRET: ${{ secrets.YON_GOOGLE_CLIENT_SECRET }}
          YON_MS_CLIENT_ID: ${{ secrets.YON_MS_CLIENT_ID }}
          YON_MS_CLIENT_SECRET: ${{ secrets.YON_MS_CLIENT_SECRET }}
        run: scripts/bundle.sh --dmg

      - name: Verify both slices
        run: |
          for f in dist/Yon.app/Contents/MacOS/Yon dist/Yon.app/Contents/Resources/rclone; do
            lipo -info "$f"
            archs=$(lipo -archs "$f")
            case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$f is not universal: $archs"; exit 1 ;; esac
          done
          codesign --verify --deep --strict dist/Yon.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yon.dmg
          path: dist/Yon.dmg
          if-no-files-found: error

      # Sparkle appcast: signs the DMG with the EdDSA private key and lists it at the release's download URL.
      # Skipped for pre-release tags so testers' builds never reach everyone's auto-update.
      - name: Generate appcast
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::SPARKLE_PRIVATE_KEY secret is not set"; exit 1; }
          umask 077; printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          mkdir -p appcast && cp dist/Yon.dmg appcast/
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --download-url-prefix "https://github.com/$REPO/releases/download/$TAG/" \
            --link "https://github.com/$REPO/releases/tag/$TAG" \
            -o appcast/appcast.xml appcast
          rm -f "$RUNNER_TEMP/sparkle.key"
          cat appcast/appcast.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          name: appcast
          path: appcast/appcast.xml
          if-no-files-found: error

  # Separate job so the only step with write access never sees the OAuth secrets.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Yon.dmg

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Yon ${{ github.ref_name }}
          files: Yon.dmg
          generate_release_notes: true
          # v1.2.3-rc1 style tags stay pre-releases so releases/latest keeps pointing at the last real one.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The appcast lives on GitHub Pages (docs/), which Sparkle in every installed copy polls.
  appcast:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appcast
          path: docs
      - name: Commit appcast to Pages
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git diff --cached --quiet || git commit -m "chore(release): appcast for $TAG"
          git push
